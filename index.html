<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dasbor Mas Andre — Monitoring Shunt Trip & AMR JTN 2026</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Library Pendukung (SheetJS, Chart.js, Lucide Icons, SweetAlert2, jsPDF) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR NAVIGASI -->
    <aside class="w-72 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800/80 flex flex-col justify-between shrink-0">
      <div>
        <!-- Brand Header -->
        <div class="p-6 border-b border-slate-800/80 flex items-center gap-3.5">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25">
            <i data-lucide="zap" class="w-6 h-6 text-slate-950 stroke-[2.5]"></i>
          </div>
          <div>
            <h1 class="font-extrabold text-lg tracking-tight text-white leading-none">DASBOR MAS ANDRE</h1>
            <p class="text-xs text-cyan-400 font-medium mt-1">Monitoring Shunt Trip JTN 2026</p>
          </div>
        </div>

        <!-- Menu Halaman (Multi-Page View) -->
        <div class="p-4">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Menu Utama</p>
          <nav class="space-y-1.5" id="sidebar-nav">
            <button data-page="overview" class="nav-btn active w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all">
              <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
              <span>Ringkasan Eksekutif</span>
            </button>
            <button data-page="pelanggan-daya" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all">
              <i data-lucide="users" class="w-5 h-5"></i>
              <span>Pelanggan & Daya</span>
            </button>
            <button data-page="lingkup-daerah" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all">
              <i data-lucide="map-pin" class="w-5 h-5"></i>
              <span>Lingkup Daerah</span>
            </button>
            <button data-page="report-harian" class="nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-semibold transition-all">
              <div class="flex items-center gap-3">
                <i data-lucide="calendar-check-2" class="w-5 h-5"></i>
                <span>Report Harian Lunas</span>
              </div>
              <span class="px-2 py-0.5 text-[10px] font-bold bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30">LIVE</span>
            </button>
            <button data-page="habit-tracker" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all">
              <i data-lucide="flame" class="w-5 h-5"></i>
              <span>Langganan Nunggak</span>
            </button>
          </nav>
        </div>
      </div>

      <!-- Panel Status Sumber Data di Bawah Sidebar -->
      <div class="p-4 border-t border-slate-800/80 space-y-3">
        <div class="p-3.5 rounded-xl bg-slate-950/90 border border-slate-800">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-slate-400">Sumber Data Aktif</span>
            <span id="data-status-badge" class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300">Menunggu</span>
          </div>
          <p id="data-source-label" class="text-xs text-slate-300 truncate font-medium">Belum ada file dimuat</p>
          <p id="last-sync-label" class="text-[11px] text-slate-500 mt-0.5">-</p>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button id="btn-open-gsheet" class="flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold transition">
            <i data-lucide="cloud-download" class="w-4 h-4"></i>
            <span>Google Sheet</span>
          </button>
          <label for="input-excel-file" class="cursor-pointer flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 text-xs font-semibold transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            <span>Upload Excel</span>
          </label>
          <input type="file" id="input-excel-file" accept=".xlsx,.xls" class="hidden" />
        </div>
      </div>
    </aside>

    <!-- AREA KONTEN UTAMA -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- TOPBAR -->
      <header class="h-20 bg-slate-900/60 backdrop-blur-md border-b border-slate-800/80 px-8 flex items-center justify-between shrink-0">
        <div>
          <h2 id="page-title" class="text-xl font-bold text-white">Ringkasan Eksekutif</h2>
          <p id="page-subtitle" class="text-xs text-slate-400 mt-0.5">Pantauan menyeluruh Pelanggan, Daya, Lingkup Daerah, Rupiah, dan Eksekusi Shunt Trip</p>
        </div>

        <!-- Filter Global Bulan & Pencarian Cepat -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2">
            <i data-lucide="calendar" class="w-4 h-4 text-cyan-400"></i>
            <span class="text-xs text-slate-400 font-medium">Periode Bulan:</span>
            <select id="global-month-filter" class="bg-transparent text-xs font-bold text-white focus:outline-none cursor-pointer pr-2">
              <option value="ALL">Semua Bulan (Jan - Okt 2026)</option>
              <option value="Januari">Januari 2026</option>
              <option value="Februari">Februari 2026</option>
              <option value="Maret">Maret 2026</option>
              <option value="April">April 2026</option>
              <option value="Mei">Mei 2026</option>
              <option value="Juni">Juni 2026</option>
              <option value="Juli">Juli 2026</option>
              <option value="Agustus">Agustus 2026</option>
              <option value="September">September 2026</option>
              <option value="Oktober">Oktober 2026</option>
            </select>
          </div>

          <button id="btn-refresh-data" title="Muat Ulang Data" class="p-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- WADAH DINAMIS SETIAP HALAMAN (PAGE CONTAINER) -->
      <main id="page-container" class="flex-1 overflow-y-auto p-8 space-y-6">
        <!-- Konten dari masing-masing modul halaman akan dirender di sini -->
      </main>
    </div>
  </div>

  <!-- Memuat Pengatur Utama dengan ES Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
